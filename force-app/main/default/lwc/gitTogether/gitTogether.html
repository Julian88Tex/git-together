<!-- Git Together Component -->
<template>
    <div class="slds-card">
        <div class="slds-card__header slds-grid">
            <header class="slds-media slds-media_center slds-has-flexi-truncate">
                <div class="slds-media__figure slds-has-flexi-truncate">
                    <lightning-icon icon-name="utility:git_branch" size="medium" alternative-text="Git Branch"></lightning-icon>
                </div>
                <div class="slds-media__body slds-has-flexi-truncate">
                    <h2 class="slds-card__header-title">
                        <span>Git Together</span>
                    </h2>
                </div>
            </header>
        </div>
        <div class="slds-card__body slds-card__body_inner">
            <div class="slds-grid slds-gutters">
                <div class="slds-col">
                    <div class="slds-box slds-theme_shade">
                        <div class="slds-text-heading_medium slds-m-bottom_small">Collaboration Stats</div>
                        <div class="slds-grid slds-grid_vertical">
                            <div class="slds-col">
                                <div class="slds-text-body_regular">
                                    Commits: <lightning-formatted-number value={commitCount} format-style="decimal"></lightning-formatted-number>
                                </div>
                            </div>
                            <div class="slds-col">
                                <div class="slds-text-body_regular">
                                    Collaborators: <lightning-formatted-number value={collaboratorCount} format-style="decimal"></lightning-formatted-number>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="slds-col">
                    <div class="slds-box slds-theme_shade">
                        <div class="slds-text-heading_medium slds-m-bottom_small">Quick Actions</div>
                        <div class="slds-grid slds-grid_vertical">
                            <div class="slds-col">
                                <lightning-button 
                                    label="Create Branch" 
                                    icon-name="utility:git_branch" 
                                    onclick={handleCreateBranch}
                                    variant="brand">
                                </lightning-button>
                            </div>
                            <div class="slds-col slds-m-top_small">
                                <lightning-button 
                                    label="Merge Changes" 
                                    icon-name="utility:merge" 
                                    onclick={handleMerge}
                                    variant="success">
                                </lightning-button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="slds-m-top_medium">
                <div class="slds-text-heading_medium slds-m-bottom_small">Recent Activity</div>
                <template if:true={hasRecentActivity}>
                    <ul class="slds-has-dividers_bottom-space">
                        <template for:each={recentActivity} for:item="activity">
                            <li key={activity.id} class="slds-item">
                                <div class="slds-grid slds-grid_align-spread">
                                    <div class="slds-truncate">
                                        <lightning-icon icon-name={activity.icon} size="x-small" alternative-text=""></lightning-icon>
                                        <span class="slds-m-left_x-small">{activity.description}</span>
                                    </div>
                                    <div class="slds-no-flex">
                                        <lightning-formatted-date-time 
                                            value={activity.timestamp} 
                                            year="numeric" 
                                            month="numeric" 
                                            day="numeric" 
                                            hour="2-digit" 
                                            minute="2-digit">
                                        </lightning-formatted-date-time>
                                    </div>
                                </div>
                            </li>
                        </template>
                    </ul>
                </template>
                <template if:false={hasRecentActivity}>
                    <div class="slds-text-body_regular slds-text-color_weak">No recent activity</div>
                </template>
            </div>
        </div>
    </div>
</template>
